[package]
name = "node"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Trilogicon reference node: V1 transfer protocol + V2 persistence, sync, and defensive networking."
readme = "../README.md"
license = "MIT"
repository = "https://github.com/ConcerfatePro/trilogicon-core"

[dependencies]
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"