[package]
name = "node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Trilogicon V1 node: accounts, signed transfers, blocks, and basic TCP sync."
readme = "../README.md"
license = "MIT"
repository = "https://github.com/ConcerfatePro/trilogicon-core"

[dependencies]
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"